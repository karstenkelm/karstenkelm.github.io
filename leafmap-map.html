raditional bergedorf wine merchant; ask for hamburger rotspon. traditionsreicher weinhändler in bergedorf. hier würde ich nach hamburger rotspon schauen. shops"}, {"id": 36, "layer": "marker_89f94402637717e04b993e76702b28bc", "search": "antiquariat near the michel browse older hamburg books and german literary classics in the michel area. auf der suche nach alten hamburg-büchern und deutschen klassikern rund um den michel. shops"}, {"id": 38, "layer": "marker_bc1a7a3b506af5b06c2f608796673ccb", "search": "aktion buch – farmsen affordable secondhand books in einkaufstreff farmsen, near u-bahn farmsen. book prices reportedly €2–6. gemeinnütziger gebrauchtbuchladen im einkaufstreff farmsen, nahe u farmsen. bücher etwa 2–6 €. shops"}, {"id": 40, "layer": "marker_b56681775b92eb55f4a67d22c89a3cac", "search": "bücherflohmarkt der bücherhallen volunteer-run secondhand book market in the zentralbibliothek. books usually €1; cash only. ehrenamtlicher bücherflohmarkt in der zentralbibliothek. bücher meist 1 €; nur bargeld. shops"}, {"id": 41, "layer": "marker_789eca904d22cc1f48c440862a484929", "search": "flohschanze saturday flea market at the alte rinderschlachthalle: vintage objects, books and curious finds. samstagsflohmarkt an der alten rinderschlachthalle mit vintage, büchern und kuriositäten. shops"}, {"id": 42, "layer": "marker_aa96877fdba86b64b021fe27840bac65", "search": "lüders buchhandlung & antiquariat independent bookshop and antiquarian books in eimsbüttel; literature, classics, philosophy and art. buchhandlung und antiquariat in eimsbüttel mit literatur, klassikern, philosophie und kunst. shops"}, {"id": 43, "layer": "marker_c17ea9233903e5fed4c5ac97cd259bed", "search": "buchhandlung & antiquariat lutz heimhalt books on history, architecture, philosophy, technology and aviation; also antiquarian postcards. bücher über geschichte, architektur, philosophie, technik und luftfahrt; auch alte postkarten. shops"}, {"id": 44, "layer": "marker_40b07225eaa73b997469e61fa4fe2       function findMarker(id) {
        for (const group of groups) for (const entry of group.markers) {
          if (String(entry.id) === String(id)) return {group, entry};
        }
        return null;
      }
      function applyFilter(category, term) {
        const needle = String(term || "").toLowerCase().trim();
        map.closePopup();
        groups.forEach(row => {
          const layerGroup = window[row.group];
          if (!layerGroup) return;
          const categoryMatches = category === "All" || row.category === category;
          row.markers.forEach(entry => {
            const marker = window[entry.layer];
            if (!marker) return;
            if (categoryMatches && (!needle || entry.search.includes(needle))) layerGroup.addLayer(marker);
            else layerGroup.removeLayer(marker);
          });
          if (categoryMatches) map.addLayer(layerGroup);
          else map.removeLayer(layerGroup);
        });
      }
      window.addEventListener("message", event => {
        if (event.origin !== window.location.origin || event.source !== window.parent) return;
        const data = event.data;
        if (!data) return;
        if (data.type === "hamburg-map-filter") applyFilter(data.category, data.term);
        if (data.type === "hamburg-map-focus") {
          const hit = findMarker(data.id);
          if (!hit) return;
          const group = window[hit.group.group], marker = window[hit.entry.layer];
          if (!marker || !group) return;
          if (!map.hasLayer(group)) map.addLayer(group);
          if (!group.hasLayer(marker)) group.addLayer(marker);
          map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), 16), {duration: 0.6});
          marker.openPopup();
        }
      });
      window.parent.postMessage({type:"hamburg-map-ready"}, window.location.origin);
    })();
