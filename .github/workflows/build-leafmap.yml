name: Build Hamburg leafmap
on:
  push:
    branches: [main]
    paths:
      - "build_map.py"
      - "data/hamburg_places.geojson"
      - ".github/workflows/build-leafmap.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hamburg-leafmap-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install leafmap and folium
        run: python -m pip install "leafmap[folium]" folium
      - name: Generate leafmap HTML
        run: python build_map.py
      - name: Verify generated map
        run: |
          test -s leafmap-map.html
          test -s leafmap-map-de.html
          grep -q 'leaflet' leafmap-map.html
          grep -q 'leaflet' leafmap-map-de.html
      - name: Commit generated static map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp leafmap-map.html /tmp/hamburg-map-en.html
          cp leafmap-map-de.html /tmp/hamburg-map-de.html
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/hamburg-map-en.html leafmap-map.html
          cp /tmp/hamburg-map-de.html leafmap-map-de.html
          git add leafmap-map.html leafmap-map-de.html
          if ! git diff --cached --quiet; then
            git commit -m "Build bilingual Hamburg maps with leafmap [skip ci]"
            git push origin HEAD:main
          fi
